name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Astro and TypeScript checks
        run: npm run check

      - name: Build
        run: npm run build

      # Validates wrangler.jsonc and the preview build without uploading.
      # Needs no Cloudflare credentials; none are configured in this repo.
      - name: Check deployment configuration (dry run, no publish)
        run: npm run deploy:check
        env:
          WRANGLER_SEND_METRICS: 'false'

      # This workflow never deploys. Preview deploys are manual
      # (`npm run deploy:preview`); see docs/deployment.md.
